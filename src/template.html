<title>PriyaMG Character Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: full-height stage with a compact inspection panel on the right (stacked under the stage on phones). */
  :root {
    --bg: #eceae8;
    --panel: #f6f4f2;
    --fg: #231d1c;
    --muted: #6d6360;
    --line: #d9d4d0;
    --accent: #6b3f36;
    --accent-fg: #ffffff;
    --field: #ffffff;
    --stage: #d8dade;
    --font-ui: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161312; --panel: #1f1b1a; --fg: #efe9e6; --muted: #a89d99; --line: #353030; --accent: #d8a89c; --accent-fg: #1a1210; --field: #2a2524; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161312; --panel: #1f1b1a; --fg: #efe9e6; --muted: #a89d99; --line: #353030; --accent: #d8a89c; --accent-fg: #1a1210; --field: #2a2524; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px; line-height: 1.35; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 304px; height: 100%; }
  .stage { position: relative; min-width: 0; min-height: 0; background: var(--stage); overflow: hidden; touch-action: none; }
  .stage canvas { display: block; width: 100%; height: 100%; cursor: grab; outline: none; }
  .stage canvas:active { cursor: grabbing; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #5b5f66; font-size: 13px; letter-spacing: .04em; pointer-events: none; }
  .loading[hidden] { display: none !important; }
  .panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .brand { display: flex; flex-direction: column; gap: 1px; }
  .brand b { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .brand span { color: var(--muted); font-size: 12px; }
  section { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  h2 { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }
  button { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; cursor: pointer; min-width: 0; line-height: 1.15; }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 500; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .wide { grid-column: 1 / -1; }
  .seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); padding: 7px 4px; font-size: 12px; }
  .seg button:last-child { border-right: 0; }
  .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .color { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .color input { appearance: none; -webkit-appearance: none; width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; flex: none; }
  .color input::-webkit-color-swatch-wrapper { padding: 2px; }
  .color input::-webkit-color-swatch { border: 0; border-radius: 4px; }
  .color input::-moz-color-swatch { border: 0; border-radius: 4px; }
  .color label { color: var(--fg); min-width: 0; }
  .row { display: grid; grid-template-columns: 78px minmax(0, 1fr) 38px; align-items: center; gap: 8px; }
  .row output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; min-width: 0; }
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .hint { color: var(--muted); font-size: 11.5px; }
  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.15fr) minmax(0, 1fr); }
    .panel { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>

<main class="app">
  <div class="stage" id="stage"><div class="loading" id="loading">Building character…</div></div>
  <aside class="panel" aria-label="Inspection controls">
    <div class="brand"><b>PriyaMG</b><span>Character viewer</span></div>

    <section aria-labelledby="h-view">
      <h2 id="h-view">View</h2>
      <div class="grid2">
        <button data-view="front">Front</button>
        <button data-view="tq">Three-quarter</button>
        <button data-view="left">Left side</button>
        <button data-view="right">Right side</button>
        <button data-view="back">Back</button>
        <button data-view="top">Top</button>
        <button data-view="face" class="wide">Face close-up</button>
      </div>
    </section>

    <section aria-labelledby="h-cam">
      <h2 id="h-cam">Camera</h2>
      <div class="grid2">
        <button id="zin">Zoom +</button>
        <button id="zout">Zoom −</button>
        <button id="fit">Fit character</button>
        <button id="resetView">Reset view</button>
      </div>
      <div class="hint">Drag to orbit, right-drag or Shift-drag to pan, scroll to zoom.</div>
    </section>

    <section aria-labelledby="h-col">
      <h2 id="h-col">Colours</h2>
      <div class="colors">
        <div class="color"><input type="color" id="c-blazer" aria-label="Blazer colour"><label for="c-blazer">Blazer</label></div>
        <div class="color"><input type="color" id="c-top" aria-label="Inner top colour"><label for="c-top">Inner top</label></div>
        <div class="color"><input type="color" id="c-trousers" aria-label="Trousers colour"><label for="c-trousers">Trousers</label></div>
        <div class="color"><input type="color" id="c-shoe" aria-label="Footwear colour"><label for="c-shoe">Footwear</label></div>
      </div>
    </section>

    <section aria-labelledby="h-light">
      <h2 id="h-light">Lighting</h2>
      <div class="seg" role="group" aria-label="Lighting preset">
        <button data-light="soft" aria-pressed="true">Soft Studio</button>
        <button data-light="warm" aria-pressed="false">Warm Studio</button>
        <button data-light="cool" aria-pressed="false">Cool Studio</button>
      </div>
      <div class="row"><label for="s-dir">Direction</label><input type="range" id="s-dir" min="-180" max="180" step="1"><output id="o-dir"></output></div>
      <div class="row"><label for="s-int">Intensity</label><input type="range" id="s-int" min="0.3" max="1.8" step="0.01"><output id="o-int"></output></div>
      <div class="row"><label for="s-exp">Exposure</label><input type="range" id="s-exp" min="0.5" max="1.8" step="0.01"><output id="o-exp"></output></div>
    </section>

    <section aria-labelledby="h-mat">
      <h2 id="h-mat">Material</h2>
      <div class="row"><label for="s-rough">Fabric rough.</label><input type="range" id="s-rough" min="0.35" max="1" step="0.01"><output id="o-rough"></output></div>
    </section>

    <section aria-labelledby="h-disp">
      <h2 id="h-disp">Display</h2>
      <label class="switch"><input type="checkbox" id="t-wire"> Wireframe</label>
      <label class="switch"><input type="checkbox" id="t-floor" checked> Studio floor</label>
    </section>

    <button class="primary" id="resetAll">Reset all</button>
  </aside>
</main>
