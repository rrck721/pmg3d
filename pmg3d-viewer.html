<title>PriyaMG Character Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: full-height stage with a compact inspection panel on the right (stacked under the stage on phones). */
  :root {
    --bg: #eceae8;
    --panel: #f6f4f2;
    --fg: #231d1c;
    --muted: #6d6360;
    --line: #d9d4d0;
    --accent: #6b3f36;
    --accent-fg: #ffffff;
    --field: #ffffff;
    --stage: #d8dade;
    --font-ui: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161312; --panel: #1f1b1a; --fg: #efe9e6; --muted: #a89d99; --line: #353030; --accent: #d8a89c; --accent-fg: #1a1210; --field: #2a2524; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161312; --panel: #1f1b1a; --fg: #efe9e6; --muted: #a89d99; --line: #353030; --accent: #d8a89c; --accent-fg: #1a1210; --field: #2a2524; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px; line-height: 1.35; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 304px; height: 100%; }
  .stage { position: relative; min-width: 0; min-height: 0; background: var(--stage); overflow: hidden; touch-action: none; }
  .stage canvas { display: block; width: 100%; height: 100%; cursor: grab; outline: none; }
  .stage canvas:active { cursor: grabbing; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #5b5f66; font-size: 13px; letter-spacing: .04em; pointer-events: none; }
  .loading[hidden] { display: none !important; }
  .panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .brand { display: flex; flex-direction: column; gap: 1px; }
  .brand b { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .brand span { color: var(--muted); font-size: 12px; }
  section { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  h2 { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }
  button { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; cursor: pointer; min-width: 0; line-height: 1.15; }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 500; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .wide { grid-column: 1 / -1; }
  .seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); padding: 7px 4px; font-size: 12px; }
  .seg button:last-child { border-right: 0; }
  .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .color { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .color input { appearance: none; -webkit-appearance: none; width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; flex: none; }
  .color input::-webkit-color-swatch-wrapper { padding: 2px; }
  .color input::-webkit-color-swatch { border: 0; border-radius: 4px; }
  .color input::-moz-color-swatch { border: 0; border-radius: 4px; }
  .color label { color: var(--fg); min-width: 0; }
  .row { display: grid; grid-template-columns: 78px minmax(0, 1fr) 38px; align-items: center; gap: 8px; }
  .row output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; min-width: 0; }
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .hint { color: var(--muted); font-size: 11.5px; }
  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.15fr) minmax(0, 1fr); }
    .panel { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>

<main class="app">
  <div class="stage" id="stage"><div class="loading" id="loading">Building character…</div></div>
  <aside class="panel" aria-label="Inspection controls">
    <div class="brand"><b>PriyaMG</b><span>Character viewer</span></div>

    <section aria-labelledby="h-view">
      <h2 id="h-view">View</h2>
      <div class="grid2">
        <button data-view="front">Front</button>
        <button data-view="tq">Three-quarter</button>
        <button data-view="left">Left side</button>
        <button data-view="right">Right side</button>
        <button data-view="back">Back</button>
        <button data-view="top">Top</button>
        <button data-view="face" class="wide">Face close-up</button>
      </div>
    </section>

    <section aria-labelledby="h-cam">
      <h2 id="h-cam">Camera</h2>
      <div class="grid2">
        <button id="zin">Zoom +</button>
        <button id="zout">Zoom −</button>
        <button id="fit">Fit character</button>
        <button id="resetView">Reset view</button>
      </div>
      <div class="hint">Drag to orbit, right-drag or Shift-drag to pan, scroll to zoom.</div>
    </section>

    <section aria-labelledby="h-col">
      <h2 id="h-col">Colours</h2>
      <div class="colors">
        <div class="color"><input type="color" id="c-blazer" aria-label="Blazer colour"><label for="c-blazer">Blazer</label></div>
        <div class="color"><input type="color" id="c-top" aria-label="Inner top colour"><label for="c-top">Inner top</label></div>
        <div class="color"><input type="color" id="c-trousers" aria-label="Trousers colour"><label for="c-trousers">Trousers</label></div>
        <div class="color"><input type="color" id="c-shoe" aria-label="Footwear colour"><label for="c-shoe">Footwear</label></div>
      </div>
    </section>

    <section aria-labelledby="h-light">
      <h2 id="h-light">Lighting</h2>
      <div class="seg" role="group" aria-label="Lighting preset">
        <button data-light="soft" aria-pressed="true">Soft Studio</button>
        <button data-light="warm" aria-pressed="false">Warm Studio</button>
        <button data-light="cool" aria-pressed="false">Cool Studio</button>
      </div>
      <div class="row"><label for="s-dir">Direction</label><input type="range" id="s-dir" min="-180" max="180" step="1"><output id="o-dir"></output></div>
      <div class="row"><label for="s-int">Intensity</label><input type="range" id="s-int" min="0.3" max="1.8" step="0.01"><output id="o-int"></output></div>
      <div class="row"><label for="s-exp">Exposure</label><input type="range" id="s-exp" min="0.5" max="1.8" step="0.01"><output id="o-exp"></output></div>
    </section>

    <section aria-labelledby="h-mat">
      <h2 id="h-mat">Material</h2>
      <div class="row"><label for="s-rough">Fabric rough.</label><input type="range" id="s-rough" min="0.35" max="1" step="0.01"><output id="o-rough"></output></div>
    </section>

    <section aria-labelledby="h-disp">
      <h2 id="h-disp">Display</h2>
      <label class="switch"><input type="checkbox" id="t-wire"> Wireframe</label>
      <label class="switch"><input type="checkbox" id="t-floor" checked> Studio floor</label>
    </section>

    <button class="primary" id="resetAll">Reset all</button>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const buildModel = (function () {
/* ===== Geometry core: pure JS, no dependencies ===== */
const PI = Math.PI, TAU = Math.PI * 2;
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = (a) => Math.sqrt(dot(a, a));
const norm = (a) => { const l = vlen(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const lerp = (a, b, t) => a + (b - a) * t;
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const dist3 = (a, b) => vlen(sub(a, b));
const gauss = (x, s) => Math.exp(-(x * x) / (2 * s * s));
const mirrorX = (p) => [-p[0], p[1], p[2]];

function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash2(ix, iy) { let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967295; }
function vnoise(x, y) { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy; const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy); return (lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), u), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), u), v)) * 2 - 1; }

/* Cardinal-interpolated table lookup. rows: [[key, v1, v2, ...], ...] ascending by key */
function table(rows, k) {
  const n = rows.length;
  if (k <= rows[0][0]) return rows[0].slice(1);
  if (k >= rows[n - 1][0]) return rows[n - 1].slice(1);
  let i = 0; while (i < n - 2 && k > rows[i + 1][0]) i++;
  const r0 = rows[Math.max(0, i - 1)], r1 = rows[i], r2 = rows[i + 1], r3 = rows[Math.min(n - 1, i + 2)];
  const t = (k - r1[0]) / (r2[0] - r1[0]);
  const out = [];
  for (let c = 1; c < r1.length; c++) {
    const m1 = (r2[c] - r0[c]) / Math.max(1e-9, (r2[0] - r0[0])) * (r2[0] - r1[0]);
    const m2 = (r3[c] - r1[c]) / Math.max(1e-9, (r3[0] - r1[0])) * (r2[0] - r1[0]);
    const t2 = t * t, t3 = t2 * t;
    out.push((2 * t3 - 3 * t2 + 1) * r1[c] + (t3 - 2 * t2 + t) * m1 + (-2 * t3 + 3 * t2) * r2[c] + (t3 - t2) * m2);
  }
  return out;
}

/* ---------- Mesh container ---------- */
class Mesh {
  constructor(mat) { this.mat = mat; this.pos = []; this.uv = []; this.col = null; this.idx = []; }
  get count() { return this.pos.length / 3; }
  addV(p, uv, col) {
    this.pos.push(p[0], p[1], p[2]);
    this.uv.push(uv ? uv[0] : 0, uv ? uv[1] : 0);
    if (col && !this.col) { this.col = new Array(this.pos.length - 3).fill(1); }
    if (this.col) { if (col) this.col.push(col[0], col[1], col[2]); else this.col.push(1, 1, 1); }
    return this.pos.length / 3 - 1;
  }
  tri(a, b, c) { this.idx.push(a, b, c); }
  append(o) {
    const off = this.count;
    if (o.col && !this.col) this.col = new Array(this.pos.length).fill(1);
    for (let i = 0; i < o.pos.length; i++) this.pos.push(o.pos[i]);
    for (let i = 0; i < o.uv.length; i++) this.uv.push(o.uv[i]);
    if (this.col) { if (o.col) for (let i = 0; i < o.col.length; i++) this.col.push(o.col[i]); else for (let i = 0; i < o.pos.length; i++) this.col.push(1); }
    for (let i = 0; i < o.idx.length; i++) this.idx.push(o.idx[i] + off);
    return this;
  }
  transform(fn) { for (let i = 0; i < this.pos.length; i += 3) { const p = fn([this.pos[i], this.pos[i + 1], this.pos[i + 2]]); this.pos[i] = p[0]; this.pos[i + 1] = p[1]; this.pos[i + 2] = p[2]; } return this; }
  /* mirror across x=0, returns new mesh with corrected winding */
  mirrored() {
    const m = new Mesh(this.mat); m.pos = this.pos.slice(); m.uv = this.uv.slice(); m.col = this.col ? this.col.slice() : null;
    for (let i = 0; i < m.pos.length; i += 3) m.pos[i] = -m.pos[i];
    m.idx = new Array(this.idx.length);
    for (let i = 0; i < this.idx.length; i += 3) { m.idx[i] = this.idx[i]; m.idx[i + 1] = this.idx[i + 2]; m.idx[i + 2] = this.idx[i + 1]; }
    return m;
  }
  P(i) { return [this.pos[i * 3], this.pos[i * 3 + 1], this.pos[i * 3 + 2]]; }
}

function computeNormals(m) {
  const n = m.count, acc = new Float64Array(n * 3);
  for (let i = 0; i < m.idx.length; i += 3) {
    const a = m.idx[i], b = m.idx[i + 1], c = m.idx[i + 2];
    const pa = m.P(a), pb = m.P(b), pc = m.P(c);
    const f = cross(sub(pb, pa), sub(pc, pa));
    for (const v of [a, b, c]) { acc[v * 3] += f[0]; acc[v * 3 + 1] += f[1]; acc[v * 3 + 2] += f[2]; }
  }
  // weld by position
  const map = new Map(), q = 1e5;
  for (let v = 0; v < n; v++) {
    const k = Math.round(m.pos[v * 3] * q) + ',' + Math.round(m.pos[v * 3 + 1] * q) + ',' + Math.round(m.pos[v * 3 + 2] * q);
    let e = map.get(k); if (!e) { e = [0, 0, 0]; map.set(k, e); }
    e[0] += acc[v * 3]; e[1] += acc[v * 3 + 1]; e[2] += acc[v * 3 + 2];
  }
  const nor = new Float32Array(n * 3);
  for (let v = 0; v < n; v++) {
    const k = Math.round(m.pos[v * 3] * q) + ',' + Math.round(m.pos[v * 3 + 1] * q) + ',' + Math.round(m.pos[v * 3 + 2] * q);
    const e = map.get(k); const nn = norm(e);
    nor[v * 3] = nn[0]; nor[v * 3 + 1] = nn[1]; nor[v * 3 + 2] = nn[2];
  }
  return nor;
}

/* ---------- Loft through rings ---------- */
const UV_TILE = 0.08;
function loft(mesh, rings, o = {}) {
  const closed = o.closed !== false, R = rings.length, n = rings[0].length, cols = closed ? n + 1 : n;
  const base = mesh.count, tile = o.tile || UV_TILE;
  const cents = rings.map(r => { let c = [0, 0, 0]; for (const p of r) c = add(c, p); return mul(c, 1 / r.length); });
  let vAcc = 0;
  for (let i = 0; i < R; i++) {
    if (i > 0) vAcc += dist3(cents[i], cents[i - 1]);
    let uAcc = 0;
    for (let j = 0; j < cols; j++) {
      const p = rings[i][j % n];
      if (j > 0) uAcc += dist3(p, rings[i][(j - 1) % n]);
      mesh.addV(p, [uAcc / tile, vAcc / tile], o.colFn ? o.colFn(p, i, j) : null);
    }
  }
  const start = mesh.idx.length;
  for (let i = 0; i < R - 1; i++) for (let j = 0; j < cols - 1; j++) {
    const a = base + i * cols + j, b = a + 1, c = a + cols, d = c + 1;
    mesh.tri(a, c, b); mesh.tri(b, c, d);
  }
  // auto-orient outward from ring centroid
  let score = 0;
  for (let t = start; t < mesh.idx.length; t += 3) {
    const pa = mesh.P(mesh.idx[t]), pb = mesh.P(mesh.idx[t + 1]), pc = mesh.P(mesh.idx[t + 2]);
    const f = cross(sub(pb, pa), sub(pc, pa));
    const ci = Math.min(R - 1, Math.floor((mesh.idx[t] - base) / cols));
    const out = sub(mul(add(add(pa, pb), pc), 1 / 3), cents[ci]);
    score += dot(f, out);
  }
  let flip = score < 0; if (o.reverse) flip = !flip;
  if (flip) for (let t = start; t < mesh.idx.length; t += 3) { const x = mesh.idx[t + 1]; mesh.idx[t + 1] = mesh.idx[t + 2]; mesh.idx[t + 2] = x; }
  return { base, cols, rows: R, flipped: flip };
}

/* fan cap from a ring; faces `hint` direction */
function fan(mesh, ring, hint, o = {}) {
  let c = [0, 0, 0]; for (const p of ring) c = add(c, p); c = mul(c, 1 / ring.length);
  const ci = mesh.addV(c, [0.5, 0.5]), base = mesh.count;
  for (let j = 0; j < ring.length; j++) mesh.addV(ring[j], [0.5 + (ring[j][0] - c[0]) / UV_TILE, 0.5 + (ring[j][2] - c[2]) / UV_TILE]);
  for (let j = 0; j < ring.length; j++) {
    const a = base + j, b = base + (j + 1) % ring.length;
    const f = cross(sub(ring[j], c), sub(ring[(j + 1) % ring.length], c));
    if (dot(f, hint) >= 0) mesh.tri(ci, a, b); else mesh.tri(ci, b, a);
  }
}

/* catmull-rom sampling of control points -> N+1 points */
function spline(pts, N) {
  const out = [], m = pts.length - 1;
  for (let k = 0; k <= N; k++) {
    const u = k / N * m; let i = Math.min(m - 1, Math.floor(u)); const t = u - i;
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(m, i + 2)];
    const t2 = t * t, t3 = t2 * t, r = [0, 0, 0];
    for (let c = 0; c < 3; c++) r[c] = 0.5 * ((2 * p1[c]) + (-p0[c] + p2[c]) * t + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * t2 + (-p0[c] + 3 * p1[c] - 3 * p2[c] + p3[c]) * t3);
    out.push(r);
  }
  return out;
}

/* tube along dense path. radiusFn(t,i)->[r1,r2] | number. ref = direction of first axis */
function tube(mesh, path, radiusFn, o = {}) {
  if (typeof radiusFn === 'number') { const rv = radiusFn; radiusFn = () => rv; }
  const sides = o.sides || 12, ref = o.ref || [0, 0, 1], N = path.length;
  const rings = [];
  for (let i = 0; i < N; i++) {
    const T = norm(sub(path[Math.min(N - 1, i + 1)], path[Math.max(0, i - 1)]));
    let A = sub(ref, mul(T, dot(ref, T))); if (vlen(A) < 1e-4) A = sub([1, 0, 0], mul(T, T[0]));
    A = norm(A); const B = norm(cross(T, A));
    let r = radiusFn(i / (N - 1), i); if (typeof r === 'number') r = [r, r];
    const ring = [];
    for (let s = 0; s < sides; s++) { const a = s / sides * TAU; const mm = o.mod ? o.mod(i / (N - 1), a, i) : 1; ring.push(add(path[i], add(mul(A, r[0] * mm * Math.cos(a)), mul(B, r[1] * mm * Math.sin(a))))); }
    rings.push(ring);
  }
  const info = loft(mesh, rings, { tile: o.tile, reverse: o.reverse, colFn: o.colFn });
  if (o.capStart) fan(mesh, rings[0], sub(path[0], path[1]));
  if (o.capEnd) fan(mesh, rings[N - 1], sub(path[N - 1], path[N - 2]));
  return rings;
}
const roundCap = (t, start = 0.88) => t < start ? 1 : Math.sqrt(Math.max(0.0, 1 - Math.pow((t - start) / (1 - start), 2)));
const roundCap2 = (t, a = 0.06, b = 0.88) => Math.min(t < a ? Math.sqrt(Math.max(0, 1 - Math.pow((a - t) / a, 2))) : 1, roundCap(t, b));

/* torus-like loop: closed centre path of points, circular cross-section */
function loopTube(mesh, centers, r, o = {}) {
  const n = centers.length, sides = o.sides || 8, rings = [];
  let cc = [0, 0, 0]; for (const p of centers) cc = add(cc, p); cc = mul(cc, 1 / n);
  const axis = o.axis || [0, 1, 0];
  for (let i = 0; i <= n; i++) {
    const p = centers[i % n], pn = centers[(i + 1) % n], pp = centers[(i + n - 1) % n];
    const T = norm(sub(pn, pp));
    let A = norm(sub(p, cc)); A = norm(sub(A, mul(T, dot(A, T))));
    const B = norm(cross(T, A));
    const rr = typeof r === 'function' ? r(i / n) : r;
    const ra = Array.isArray(rr) ? rr : [rr, rr];
    const ring = [];
    for (let s = 0; s < sides; s++) { const a = s / sides * TAU; ring.push(add(p, add(mul(A, ra[0] * Math.cos(a)), mul(B, ra[1] * Math.sin(a))))); }
    rings.push(ring);
  }
  // loop closes: last ring == first ring geometry; use closed=true on ring but rows wrap by duplicate
  loft(mesh, rings, { tile: o.tile });

function headRay(x, y) {

  for (const t of HEAD.tris) {
    if (x < t.minx || x > t.maxx || y < t.miny || y > t.maxy) continue;

const onFace = (x, y, off) => { const h = headRay(x, y); return { p: add(h.p, mul(h.n, off)), n: h.n }; };

/* ---------- eyes ---------- */
const EYE_R = 0.0118;
function buildEye(F, sg) {
  const sk = F('skin'), scl = F('sclera'), iris = F('iris'), cor = F('cornea'), lash = F('lash'), crease = F('skinDark');
  const surf = headRay(sg * 0.0315, 0.004);
  const c = [sg * 0.0315, 0.004, surf.p[2] - 0.0042];
  const te = sg * 0.085;
  const bx = [Math.cos(te), Math.sin(te), 0], by = [-Math.sin(te), Math.cos(te), 0], bz = [0, 0, 1];
  const R = EYE_R;
  ellipsoid(scl, c, [R, R, R], { bx, by, bz, nu: 36, nv: 26 });
  // iris disc (planar UV)
  const ri = 0.0058, ctr = iris.addV(add(c, mul(bz, R * 1.0012)), [0.5, 0.5]);
  const nRing = 8, nSeg = 36, base = iris.count, itri0 = iris.idx.length;
  for (let k = 1; k <= nRing; k++) { const rho = ri * k / nRing; for (let j = 0; j < nSeg; j++) { const a = j / nSeg * TAU; const lx = rho * Math.cos(a), ly = rho * Math.sin(a), lz = Math.sqrt(R * R - rho * rho) * 1.0012; iris.addV(add(c, add(add(mul(bx, lx), mul(by, ly)), mul(bz, lz))), [0.5 + lx / (2 * ri), 0.5 + ly / (2 * ri)]); } }

  for (let j = 0; j < nSeg; j++) iris.tri(ctr, ringI(1) + j, ringI(1) + (j + 1) % nSeg);
  for (let k = 1; k < nRing; k++) for (let j = 0; j < nSeg; j++) { const a = ringI(k) + j, b = ringI(k) + (j + 1) % nSeg, cc = ringI(k + 1) + j, d = ringI(k + 1) + (j + 1) % nSeg; iris.tri(a, cc, b); iris.tri(b, cc, d); }
  { const pa = iris.P(iris.idx[itri0]), pb = iris.P(iris.idx[itri0 + 1]), pc = iris.P(iris.idx[itri0 + 2]);
    if (dot(cross(sub(pb, pa), sub(pc, pa)), bz) < 0) for (let u = itri0; u < iris.idx.length; u += 3) { const x = iris.idx[u + 1]; iris.idx[u + 1] = iris.idx[u + 2]; iris.idx[u + 2] = x; } }

  ellipsoid(cor, c, [R * 1.025, R * 1.025, R * 1.025], { bx, by: bz, bz: mul(by, -1), nu: 28, nv: 8, t0: 0, t1: 0.72 });

  const RL = R * 1.09;
  const thu = psi => PI / 2 - 0.40 * Math.pow(Math.sin(psi), 0.72);

  const nPsi = 30, nTh = 10;
  const upper = [], lower = [];
  for (let j = 0; j <= nTh; j++) {
    const ru = [], rl = [];
    for (let i = 0; i <= nPsi; i++) {

  // lash line (upper lid margin) + lower waterline
  const edgeU = [], edgeL = [];
  for (let i = 0; i <= 30; i++) { const psi = 0.04 + (PI - 0.08) * i / 30; edgeU.push(lidPt(psi, thu(psi) + 0.012, RL * 1.002)); edgeL.push(lidPt(psi, thl(psi) - 0.012, RL * 1.0)); }

  const latFrac = (i) => sg > 0 ? 1 - i / 30 : i / 30;
  tube(lash, edgeU, (t, i) => 0.00085 + 0.0007 * smooth(0.45, 1, latFrac(i)) , { sides: 6, ref: bz, capStart: true, capEnd: true });

}

/* ---------- brows ---------- */
function buildBrow(F, sg) {
  const m = F('brow');
  const ctrl = [[0.0105, 0.0292, 0.0086], [0.0210, 0.0328, 0.0098], [0.0320, 0.0358, 0.0102], [0.0440, 0.0340, 0.0088], [0.0550, 0.0290, 0.0064], [0.0625, 0.0248, 0.0036]];
  const pts = spline(ctrl.map(c => [c[0], c[1], c[2]]), 28);
  const P = (s, w) => {
    const i = Math.min(pts.length - 1, Math.round(s * (pts.length - 1)));
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(pts.length - 1, i + 1)], p = pts[i];
    let tx = p1[0] - p0[0], ty = p1[1] - p0[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const nx = -ty, ny = tx, h = p[2];
    const off = (w - 0.4) * h;
    const x = p[0] + nx * off, y = p[1] + ny * off;
    const f = onFace(sg * x, y, 0.0016 + 0.0006 * Math.sin(PI * w));
    return f.p;
  };
  thickPatch(m, m, m, P, 28, 5, 0.0010, { hint: [0, 0, 1], uvFn: (s, w) => [s, w], noEdges: true });
}

/* ---------- nose details, mouth, ears ---------- */
function buildNostrils(F) {
  const m = F('nostril');
  for (const sg of [1, -1]) { const f = onFace(sg * 0.0078, -0.0538, -0.0004); ellipsoid(m, f.p, [0.0042, 0.0020, 0.0036], { nu: 14, nv: 8 }); }
}
function buildMouth(F) {
  const lips = F('lips'), teeth = F('teeth'), cav = F('mouth');
  const hw = 0.0268, yc = -0.0658;
  const yu = x => yc + (-0.0718 - yc) * (1 - Math.pow(Math.abs(x) / hw, 2.2));
  const yl = x => yc + (-0.0788 - yc) * (1 - Math.pow(Math.abs(x) / hw, 1.7));
  const ru = x => 0.0041 * Math.sqrt(Math.max(0, 1 - Math.pow(x / hw, 2))) + 0.0005;
  const rl = x => 0.0052 * Math.sqrt(Math.max(0, 1 - Math.pow(x / hw, 2))) + 0.0005;
  const N = 36, cs = [], rr = [];
  for (let i = 0; i <= N; i++) { const x = -hw + 2 * hw * i / N; const y = yu(x) + ru(x) * 0.85 + 0.0005 * Math.exp(-Math.pow((Math.abs(x) - 0.004) / 0.0035, 2)) ; cs.push(onFace(x, y, 0.0012).p); rr.push(ru(x)); }
  for (let i = N - 1; i >= 1; i--) { const x = -hw + 2 * hw * i / N; const y = yl(x) - rl(x) * 0.85; cs.push(onFace(x, y, 0.0014).p); rr.push(rl(x)); }
  const n = cs.length;
  loopTube(lips, cs, t => { const i = Math.min(n - 1, Math.round(t * n)); return [rr[i] * 1.0, rr[i] * 0.85]; }, { sides: 10 });
  // dark cavity
  const outline = []; for (let i = 0; i <= N; i += 2) { const x = -hw * 0.97 + 2 * hw * 0.97 * i / N; outline.push(onFace(x, yu(x) - 0.0004, 0.0004).p); }
  const low = []; for (let i = N; i >= 0; i -= 2) { const x = -hw * 0.97 + 2 * hw * 0.97 * i / N; low.push(onFace(x, yl(x) + 0.0004, 0.0004).p); }
  const poly = outline.concat(low); fan(cav, poly, [0, 0, 1]);
  // upper teeth
  const TW = [[0.0041, 0.0086], [0.0104, 0.0068], [0.0156, 0.0058]];
  for (const [tx, tw] of TW) for (const sg of [1, -1]) {
    const x = tx * sg, y = yu(x) - 0.0028;
    const f = onFace(x, y, 0.0006);
    ellipsoid(teeth, f.p, [tw / 2 * 1.04, 0.0030, 0.0017], { nu: 12, nv: 8 });

}
function buildEar(F, sg) {
  const sk = F('skin');
  const flare = 0.34;
  const Zd = norm([sg * Math.sin(flare), 0, -Math.cos(flare)]), Xo = norm([sg * Math.cos(flare), 0, Math.sin(flare)]), Yd = [0, 1, 0];
  const O = [sg * 0.0728, -0.006, 0.0035];
  const H = 0.0315, W = 0.0172, cw = 0.0178, tilt = 0.20;
  const P = (s, w) => {
    const rho = s, th = w * TAU;
    let cy = Math.cos(th), sz = Math.sin(th);
    const lobe = cy < 0 ? 1 - 0.20 * (-cy) : 1;
    let ey = rho * H * cy * (cy < -0.2 ? 0.96 : 1), ez = rho * W * sz * lobe;
    const ct = Math.cos(tilt), st = Math.sin(tilt);

    const dep = -0.0030 + 0.0030 + 0.0060 * rim * (1 - 0.7 * lobeFlat) + 0.0026 * ridge - 0.0034 * bowl * (1 - lobeFlat) + 0.0022 * (1 - rho * rho) * 0.0;

function buildFace() {
  const reg = {}; const F = id => reg[id] || (reg[id] = new Mesh(id));
  const head = buildHeadMesh();
  F('skin').append(head);
  buildEye(F, 1); buildEye(F, -1);
  buildBrow(F, 1); buildBrow(F, -1);

/* ===== Hair: scalp cap + layered swept locks (head-local, moved to HC) ===== */
const HAIRLINE = [[0, 58], [20, 60], [45, 69], [65, 78], [78, 90], [86, 92], [89, 76], [105, 74], [112, 82], [120, 98], [135, 116], [155, 126], [180, 129]];
const hairline = az => table(HAIRLINE, Math.abs(az) * 180 / PI)[0] * PI / 180;
const dirOf = (az, pol) => [Math.sin(pol) * Math.sin(az), Math.cos(pol), Math.sin(pol) * Math.cos(az)];
const hairPt = (d, off) => { const R = headRadius(d); return [d[0] * (R + off), d[1] * (R + off), d[2] * (R + off)]; };

function buildHair() {
  const rnd = rng(11);
  const cap = new Mesh('hairCap'), locks = new Mesh('hair');
  const rings = [], M_ = 40, N_ = 168;

    const t = i / M_, ring = [];

  }

  const R = rnd, jit = (v, a) => v + (R() - 0.5) * a;
  function lock(d0, flow, arc, vol, width, thick, tipLift, wig, shade) {
    let f = sub(flow, mul(d0, dot(flow, d0))); f = norm(f);
    const side = norm(cross(d0, f)), nSeg = 12;
    const build = (A) => {
      const pts = [];
      for (let k = 0; k <= nSeg; k++) {
        const t = k / nSeg, ang = A / 0.1 * t;
        let d = add(mul(d0, Math.cos(ang)), mul(f, Math.sin(ang)));
        d = norm(add(d, mul(side, wig * Math.sin(t * 3.0 + shade * 7) * 0.25 * t)));
        pts.push({ d, off: 0.0026 + vol * Math.pow(Math.sin(PI * Math.pow(t, 0.8)), 0.9) + tipLift * t * t * t });
      }

    };

      const e = P[nSeg].d, pol = Math.acos(clamp(e[1], -1, 1)), az = Math.atan2(e[0], e[2]);
      if (pol > hairline(az) - 0.05 && A > 0.012) { A *= 0.88; P = build(A); } else break;
    }
    const pts = P.map(q => hairPt(q.d, q.off)), ringsL = [];
    for (let k = 0; k <= nSeg; k++) {
      const t = k / nSeg, p = pts[k];
      const T = norm(sub(pts[Math.min(nSeg, k + 1)], pts[Math.max(0, k - 1)]));
      const W = norm(cross(T, norm(p))), Nn = norm(cross(W, T));
      const hw = width * 0.5 * (0.55 + 0.45 * smooth(0, 0.25, t)) * (1 - 0.78 * Math.pow(t, 3.0)) + 0.0004;
      const ht = thick * 0.5 * (1 - 0.85 * Math.pow(t, 2.2)) + 0.00015;
      const ring = [];
      for (let s = 0; s < 6; s++) { const a = s / 6 * TAU; ring.push(add(p, add(mul(W, hw * Math.cos(a)), mul(Nn, ht * Math.sin(a))))); }
      ringsL.push(ring);
    }
    loft(locks, ringsL, { tile: 0.05, colFn: (p, i) => { const t = i / nSeg; const g = shade * (0.82 + 0.3 * t); return [g, g, g * 1.02]; } });
  }

    const pol = Math.acos(1 - R() * (1 - Math.cos(1.0))), az = R() * TAU - PI;
    if (pol > hairline(az) - 0.07) continue;
    const k = 1 - pol / 1.2;
    lock(dirOf(az, pol), [jit(1.0, 0.16), jit(0.05, 0.12), jit(0.30, 0.25)], 0.056 + 0.026 * R(), (0.009 + 0.010 * R()) * (0.45 + k), 0.017 + 0.008 * R(), 0.0038, 0.002 + 0.003 * R(), 0.12, 0.84 + 0.3 * R());
  }
  // 2. fringe along the front hairline, lifted and swept
  for (let i = 0; i < 90; i++) {
    const az = -0.85 + R() * 1.8, pol = hairline(az) - 0.05 - R() * 0.12;
    lock(dirOf(az, pol), [jit(0.85, 0.2), jit(0.55, 0.15), jit(-0.15, 0.2)], 0.042 + 0.022 * R(), 0.010 + 0.008 * R(), 0.014 + 0.005 * R(), 0.0034, 0.005 + 0.004 * R(), 0.12, 0.85 + 0.3 * R());
  }
  // 3. sides, short and close

    const sg = i % 2 ? 1 : -1, az = sg * (0.50 + R() * 1.30), pol = hairline(az) - 0.28 - R() * 0.60;
    if (pol < 0.25) continue;
    lock(dirOf(az, pol), [jit(0, 0.2), -0.8, -0.5 + jit(0, 0.3)], 0.026 + 0.016 * R(), 0.003, 0.011 + 0.004 * R(), 0.0032, 0.0, 0.1, 0.72 + 0.3 * R());
  }

    const az2 = (R() < 0.5 ? 1 : -1) * (PI - 0.9 + R() * 0.9), pol = Math.min(hairline(az2) - 0.25, 0.85 + R() * 1.1);
    if (pol < 0.8) continue;
    lock(dirOf(az2, pol), [jit(0.55, 0.4), -0.8, jit(-0.1, 0.2)], 0.036 + 0.024 * R(), 0.005, 0.010 + 0.004 * R(), 0.0030, 0.001, 0.2, 0.68 + 0.45 * R());
  }
  // 5. nape
  for (let i = 0; i < 90; i++) {
    const az = (R() < 0.5 ? 1 : -1) * (PI - R() * 0.8), pol = hairline(az) - 0.12 - R() * 0.3;
    lock(dirOf(az, pol), [jit(0.15, 0.2), -1, 0], 0.020 + 0.010 * R(), 0.002, 0.008, 0.003, 0.0, 0.1, 0.65 + 0.4 * R());
  }
  // 6. crown / back-top swept

    const az = (R() < 0.5 ? 1 : -1) * (PI - 0.2 - R() * 1.5), pol = 0.3 + R() * 0.65;
    lock(dirOf(az, pol), [jit(0.9, 0.4), jit(-0.25, 0.3), jit(-0.3, 0.3)], 0.050 + 0.025 * R(), 0.008 + 0.008 * R(), 0.011 + 0.005 * R(), 0.0032, 0.003, 0.2, 0.72 + 0.5 * R());
  }
  cap.transform(p => add(p, HC)); locks.transform(p => add(p, HC));
  M('hairCap').append(cap); M('hair').append(locks);
}

function buildModel() {
  for (const k in registry) delete registry[k];
  buildTop(); buildNeck(); buildJacket();
  buildArmSide(M);
  const tmp = {}; buildArmSide(id => tmp[id] || (tmp[id] = new Mesh(id)));
  for (const id in tmp) M(id).append(tmp[id].mirrored());
  buildWatch(); buildTrousers(); buildFeet(); buildFace(); buildHair();

  for (const id in registry) {
    const m = registry[id]; if (!m.idx.length) continue;
    parts.push({ id, mat: m.mat, pos: new Float32Array(m.pos), nor: computeNormals(m), uv: new Float32Array(m.uv), col: m.col ? new Float32Array(m.col) : null, idx: new Uint32Array(m.idx) });
  }
  return parts;
}

  return buildModel;
})();

    $('s-int').value = state.intensity; $('o-int').textContent = state.intensity.toFixed(2);
    $('s-exp').value = state.exposure; $('o-exp').textContent = state.exposure.toFixed(2);
    $('s-rough').value = state.rough; $('o-rough').textContent = state.rough.toFixed(2);
    $('t-wire').checked = state.wire; $('t-floor').checked = state.floor;
  }
  function bindUI() {
    document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
    $('zin').addEventListener('click', () => { cam.dist *= 0.8; applyCam(); });
    $('zout').addEventListener('click', () => { cam.dist /= 0.8; applyCam(); });
    $('fit').addEventListener('click', fitCharacter);
    $('resetView').addEventListener('click', resetView);
    for (const k of ['blazer', 'top', 'trousers', 'shoe']) $('c-' + k).addEventListener('input', e => { state.colors[k] = e.target.value; updateDerivedColors(); requestRender(); });
    document.querySelectorAll('[data-light]').forEach(b => b.addEventListener('click', () => setLightPreset(b.dataset.light)));
    $('s-dir').addEventListener('input', e => { state.dir = +e.target.value; $('o-dir').textContent = state.dir + '°'; applyKeyDirection(); });
    $('s-int').addEventListener('input', e => { state.intensity = +e.target.value; $('o-int').textContent = state.intensity.toFixed(2); applyIntensity(); });
    $('s-exp').addEventListener('input', e => { state.exposure = +e.target.value; $('o-exp').textContent = state.exposure.toFixed(2); applyIntensity(); });
    $('s-rough').addEventListener('input', e => setRoughness(+e.target.value));
    $('t-wire').addEventListener('change', e => setWire(e.target.checked));
    $('t-floor').addEventListener('change', e => setFloor(e.target.checked));
    $('resetAll').addEventListener('click', () => {
      Object.assign(state, JSON.parse(JSON.stringify(DEFAULTS)));
      syncUI(); updateDerivedColors(); setRoughness(state.rough); setWire(false); setFloor(true);
      applyKeyDirection(); setLightPreset(state.light); resetView();
    });
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stageEl);
  }

  /* ---------- boot ---------- */
  function loop() { if (dirty) { dirty = false; renderer.render(scene, camera); } requestAnimationFrame(loop); }
  function boot() {
    try {
      buildStage(); makeMaterials(); syncUI(); bindUI(); applyKeyDirection(); applyPreset(state.light);
      buildCharacter(); renderer.shadowMap.needsUpdate = true; resize(); resetView(); setWire(false);
      $('loading').hidden = true; loop();
    } catch (err) {
      console.error(err); $('loading').textContent = 'The 3D viewer could not start: ' + (err && err.message ? err.message : err);
    }
  }
  if (typeof THREE === 'undefined') { $('loading').textContent = 'Three.js did not load. Check your connection and reload.'; }
  else setTimeout(boot, 30);
  window.__viewer = { setView, state, cam, mats, requestRender };
})();

</script>
